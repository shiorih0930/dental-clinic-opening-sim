function judge(kind,sc){
  var d,tag,cls='mid',ng=false;
  if(kind==='accept'){d=-15;tag='◎ 状況に沿った受け止め';cls='ok'}
  else if(kind==='tpl'){d=5;tag='△ 定型の共感だけ（状況に触れていない）'}
  else if(kind==='justify'){d=15;tag='✕ NG 正当化・弁明';cls='ng';ng=true}
  else if(kind==='ask'){ if(sc.acc){d=-2;tag='○ 希望の確認'} else {d=10;tag='✕ NG 受け止める前に欲求を聞いた';cls='ng';ng=true} }
  else if(kind==='fact'){ if(sc.acc){d=-3;tag='○ 事実確認';cls='ok'} else {d=8;tag='△ 受け止める前の事実確認'} }
  else if(kind==='act'){ if(sc.acc){d=-10;tag='◎ 具体的な行動の提示';cls='ok'} else {d=6;tag='△ 受け止める前の解決策'} }
  else {d=3;tag='△ 状況に触れていない返答'}
  if(sc.last===kind){d=Math.round(d/2);tag+='（同じ対応の連続で、効き方は半分）'}
  return {d:d,tag:tag,cls:cls,ng:ng};
}
function txt(sc,kind,turn){var a=sc.def.tx[kind];return a[turn%a.length]}
function choicesFor(sc){

}
function choose(kind,opt){
  var sc=S.sc; if(sc.over) return;
  var j=judge(kind,sc);
  var text=opt?opt.text:txt(sc,kind,sc.turn);
  if(opt&&S.fat>=70&&kind==='act'){j.d=Math.round(j.d/2);j.tag+='（疲れで言葉が散漫）'}
  var note=opt&&opt.note?opt.note:'';
  sc.g=clamp(sc.g+j.d,0,100);
  if(kind==='accept') sc.acc=true;
  sc.last=kind;
  if(j.ng){sc.ng++;S.ng++}
  var reply=(opt&&opt.reply)?opt.reply:(sc.def.rep[kind]?sc.def.rep[kind][sc.g>=50?1:0]:(sc.g>=50?'……（黙っている）':'そうですか。'));
  var tag=j.tag+(note?' · '+note:'');
  sc.tr.push({who:'dr',text:text,tag:tag,cls:j.cls,d:j.d});
  sc.tr.push({who:'pt',text:reply});
  sc.rev.push({text:text,tag:tag,cls:j.cls,d:j.d});

}

function genEvent(){
  if(Math.random()<0.12) return null;
  var staffAll=S.roster.filter(function(x){return x.role!=='院長'&&x.st==='在籍'});
  var fem=staffAll.filter(function(x){return x.f&&(x.role==='歯科衛生士'||x.role==='歯科助手')});
  var cand=[];
  if(fem.length) cand.push({w:3,t:'mat'});
  if(staffAll.length){cand.push({w:2+(S.staff<50?3:0),t:'quit'});cand.push({w:2+(S.staff<50?3:0),t:'conf'});cand.push({w:1.5+(S.fat>=50?3:0),t:'sick'})}
  var okEq=S.eqs.filter(function(x){return x.st.indexOf('稼働中')===0});
  if(okEq.length) cand.push({w:4,t:'eq'});
  if(!cand.length) return null;
  var c=pickW(cand,function(x){return x.w});
  if(c.t==='mat') return evMat(pickA(fem));
  if(c.t==='quit') return evQuit(pickA(staffAll));
  if(c.t==='conf'){ if(staffAll.length<2) return evQuit(staffAll[0]); var a=pickA(staffAll), b; do{b=pickA(staffAll)}while(b===a); return evConf(a,b)}
  if(c.t==='sick') return evSick(pickA(staffAll));
  return evEq(pickW(okEq,function(x){return EQC[x.k].w}));
}

function styleKey(){
  var conv=S.res.filter(function(r){return r.out==='収束'}).length;
  if(S.fat>=60&&S.staff<60) return 'solo';
  if(S.staff>=70) return 'team';
  if(conv>=2&&S.rep>=60) return 'patient';
  if(S.funds>=700&&S.staff<60) return 'eff';

}

var FBAX=[['listen','話を聞いてくれる'],['praise','感謝・声かけ'],['growth','成長の支援'],['env','働きやすさ'],['stable','院長の安定感']];
var FBHI={listen:['話を最後まで聞いてくれるので、相談しやすいです。','困っているとき、すぐ声をかけてくれて助かっています。'],praise:['頑張りを見て、ありがとうと言ってくれるのが嬉しいです。','小さなことでも気づいて褒めてくれて、やる気が出ます。'],growth:['学ぶ機会をつくってくれて、成長している実感があります。','任せてもらえる仕事が増えて、やりがいがあります。'],env:['休みやシフトに配慮してくれて、長く働けそうです。','急な休みにも理解があって、安心して働けます。'],stable:['どんな時も落ち着いていて、安心して任せられます。','忙しい日でも笑顔でいてくれて、医院の雰囲気が明るいです。']};
var FBLO={listen:['忙しそうで、相談するタイミングがつかめないことがあります。','意見を言っても、聞き流されたように感じる日があります。'],praise:['できて当たり前と思われている気がして、少しさみしいです。','頑張っても、声をかけてもらえる機会が少ないです。'],growth:['新しいことを学ぶ機会が少なく、このままで良いのか不安です。','教えてもらえる時間が少なく、成長が止まっている気がします。'],env:['人手が足りない中で、一人ひとりの負担が重くなっています。','シフトが厳しく、休みを言い出しにくいです。'],stable:['先生がお疲れの様子で、こちらまで心配になります。','医院の先行きが見えず、少し不安になることがあります。']};
function hashN(str){var h=0,i;for(i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))|0;return Math.abs(h)}
function half(v){return Math.max(1,Math.min(5,Math.round(v*2)/2))}
function calcFb(){
  var T=S.trk||{pos:0,neg:0,inv:0}, r=(T.pos-T.neg)/Math.max(4,T.pos+T.neg), sf=(S.staff-50)/35;
  var quit=S.roster.filter(function(x){return x.st==='退職'}).length;
  var base={listen:3+r*1.6,praise:3+sf,growth:2.6+Math.min(T.inv,4)*0.45+(S.staff-50)/100,env:3.3-(S.capPen+S.tmpPen)*3-quit*0.3+(S.staff-50)/70,stable:3.2-(S.fat-35)/40+(S.funds>=S.funds0*0.8?0.3:-0.3)};
  var bias={'歯科衛生士':{growth:0.3,praise:-0.1},'歯科助手':{praise:0.3,growth:-0.2},'勤務医':{growth:0.3,listen:-0.2}};
  var people=S.roster.filter(function(x){return x.role!=='院長'&&x.st!=='退職'}).slice(0,6).map(function(x){
    var sc={},sum=0,seed=hashN(x.n+(S.code||''));
    FBAX.forEach(function(a,i){var nz=(((seed>>(i*3))%9)-4)/5.5, bs=(bias[x.role]&&bias[x.role][a[0]])||0; sc[a[0]]=half(base[a[0]]+nz+bs); sum+=sc[a[0]]});
    var avg=sum/5, hi=FBAX[0][0], lo=FBAX[0][0];
    FBAX.forEach(function(a){if(sc[a[0]]>sc[hi])hi=a[0]; if(sc[a[0]]<sc[lo])lo=a[0]});
    var stay=avg>=3.5?'このまま働き続けたい':(avg>=2.7?'少し迷っている':'辞めることを考えている');
    return {n:x.n,role:x.role,st:x.st,sc:sc,avg:avg,stay:stay,sc2:avg>=3.5?'yes':(avg>=2.7?'mid':'no'),msg:FBHI[hi][seed%2]+' ただ、'+FBLO[lo][(seed>>4)%2]};
  });
  var tot=0; people.forEach(function(q){tot+=q.avg}); var avgAll=people.length?tot/people.length:3;
  var axAvg=FBAX.map(function(a){var t=0; people.forEach(function(q){t+=q.sc[a[0]]}); return [a[1],people.length?t/people.length:3]});
  var mood=avgAll>=3.9?'happy':(avgAll>=3.2?'ok':(avgAll>=2.5?'worn':'down'));
  return {people:people,avg:avgAll,axAvg:axAvg,mood:mood};
}
function stars(v){var f=Math.floor(v),h=v-f>=0.5,o='',i;for(i=0;i<f;i++)o+='★';if(h)o+='☆';return o}
function fbHtml(){

    return '<div class="fbc"><div class="fbh"><b>'+esc(q.n)+'</b><span class="fbrole">'+esc(q.role)+'</span><span class="stay '+q.sc2+'">'+esc(q.stay)+'</span></div><div class="fbs">'+FBAX.map(function(a){return '<span>'+esc(a[1])+' <i>'+q.sc[a[0]].toFixed(1)+'</i></span>'}).join('')+'</div><p class="fbm">「'+esc(ai||q.msg)+'」</p></div>'}).join('')+'</div>';
  if(SAMPLE) h+='<div class="row"><button class="btn ghost" data-act="ai360"'+(S.fbBusy?' disabled':'')+'>'+(S.fbBusy?'本音を聞いています…':'AIでスタッフの本音を聞く')+'</button></div>';

function render(){
  var v='';
  if(S.phase==='intro') v=viewIntro();
  else if(S.phase==='roll') v=viewRoll();
  else if(S.phase==='profile') v=viewProfile();
  else if(S.phase==='run') v=viewRun();
  else if(S.phase==='settle') v=viewSettle();
  else if(S.phase==='claimintro') v=viewClaimIntro();
  else if(S.phase==='event') v=viewEvent();
  else if(S.phase==='decide') v=viewDecide();
  else if(S.phase==='scene') v=viewScene();
  else if(S.phase==='after') v=viewAfter();
  else v=viewFinal();
  if(['event','decide','run','settle','claimintro','scene','after'].indexOf(S.phase)>=0) v=banner()+v;

document.addEventListener('input',function(ev){
  if(ev.target&&ev.target.id==='ft') S.draft=ev.target.value;
});
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]'); if(!b||b.disabled) return;
  var a=b.getAttribute('data-act');
  if(a==='start'){
    S.mode=(b.getAttribute('data-mode')==='csv'&&SAMPLE&&CSV.length>=3)?'csv':'sample';
    S.csvList=(S.mode==='csv')?pickCsv():[];
    rollProfile(); S.phase='roll'; render(); startRoulette(); return;
  }
  else if(a==='reroll'){rollProfile(); S.phase='roll'; render(); startRoulette(); return}
  else if(a==='rollskip'){if(RIV){clearInterval(RIV);RIV=null} S.phase='profile'}
  else if(a==='begin'){buildRoster();S.day=0;S.m=1;newMonth()}
  else if(a==='pause'){S.paused=!S.paused; if(!S.paused) resumeClock()}
  else if(a==='speed'){S.speed=Number(b.getAttribute('data-v'))||1; S.paused=false; resumeClock()}
  else if(a==='evpick'){var ev0=S.ev; if(ev0&&ev0.done==null){var ii=Number(b.getAttribute('data-i')); var d0={},o0=S.other,k0; for(k0 in S.d) d0[k0]=S.d[k0]; ev0.res=ev0.opts[ii].fx(); ev0.done=ii; ev0.dd={}; for(k0 in S.d){var dv=S.d[k0]-(d0[k0]||0); if(dv) ev0.dd[k0]=dv} ev0.dother=Math.round((S.other-o0)*10)/10; S.evsum=ev0.title+'（'+ev0.opts[ii].t+'）'; S.mlog.push(ev0.kind+'：'+ev0.title+' → '+ev0.opts[ii].t)}}
  else if(a==='evgo'){S.phase='run'; resumeClock()}
  else if(a==='decide'){
    var o=decOpts()[+b.getAttribute('data-i')];
    S.pick=o; apply(o.e);
    S.sched=makeSched(); S.paused=false; S.speed=S.speed||1; S.phase='run'; resumeClock(); clockOn();
    fpush('決断：'+o.t,'経営の決断'); S.mlog.push('経営の決断：'+o.t);
  }
  else if(a==='scene'){
    var d=curScn();
    var sc0={def:d,csv:S.mode==='csv',turn:0,g:d.g,acc:false,last:null,tr:[],rev:[],over:null,ng:0};
    S.sc=sc0; S.phase='scene'; S.draft=''; S.ftmsg='';
    if(sc0.csv){
      BUSY=true; render();
      csvCall('',true).then(function(r){
        BUSY=false; if(S.sc!==sc0) return;
        var t=(r&&typeof r.patient_reply==='string'&&r.patient_reply.trim())?r.patient_reply.trim().slice(0,160):'あの、少しお話しいいですか。';
        sc0.tr.push({who:'pt',text:t}); setChoices(sc0,r); render();
      }).catch(function(e){
        BUSY=false; if(S.sc!==sc0) return;
        var i=errInfo(e); if(i.fatal){SAMPLE=null}
        sc0.tr.push({who:'pt',text:'あの、少しお話しいいですか。'}); S.ftmsg='最初の発言を作れませんでした。'+i.msg; render();
      });
      return;
    }
    sc0.tr.push({who:'pt',text:d.open});
  }
  else if(a==='choose'){ if(BUSY) return; choose(b.getAttribute('data-k')) }
  else if(a==='free'||a==='pick'){
    if(BUSY||!SAMPLE||!S.sc||S.sc.over) return;
    var ta=$('#ft'); var t;
    if(a==='pick'){var ch=(S.sc.choices||[])[Number(b.getAttribute('data-i'))]; t=ch?ch.t:''}
    else t=((ta&&ta.value)||'').trim().slice(0,120);
    if(!t){S.ftmsg='返答を入力してください。';render();return}
    BUSY=true; S.draft=t; S.ftmsg=''; render();
    var scF=S.sc, csvMode=scF.csv;
    (csvMode?csvCall(t,false):judgeFree(t)).then(function(r){
      BUSY=false; if(S.sc!==scF) return;
      S.draft=''; S.ftmsg='';
      if(csvMode){chooseCsv(t,r||{})}
      else{
        var kind=(r&&KINDS.indexOf(r.kind)>=0)?r.kind:'other';
        var reply=(r&&typeof r.reply==='string'&&r.reply.trim())?r.reply.trim().slice(0,120):'';
        var note=(r&&typeof r.note==='string')?r.note.trim().slice(0,40):'';
        choose(kind,{text:t,reply:reply,note:note});
      }
      render();
    }).catch(function(e){
      BUSY=false; if(S.sc!==scF) return;
      var i=errInfo(e); if(i.fatal){SAMPLE=null}
      S.ftmsg=i.fatal?'':i.msg; render();
    });
    return;
  }
  else if(a==='after'){
    var sc=S.sc, e=OUT[sc.over];
    var r0=avg();
    apply(e);
    var qmiss=(S.quota>0&&S.newp<S.quota);
    if(qmiss) apply({fat:5,staff:-2});
    var cr=sc.def.rv[sc.over];
    var revs=[{stars:cr[0],text:cr[1],mine:true}].concat(genReviews());
    revs.forEach(function(r){S.rsum+=r.stars;S.rn++});
    S.after={e:e,reviews:revs,r0:r0,r1:avg(),nextNew:nextNew(),qmiss:qmiss};
    S.res.push({out:sc.over,g:sc.g,ng:sc.ng,type:sc.def.type,cat:sc.def.cat});
    S.dayEv[S.claimDay]=(sc.over==='収束'?'cg':(sc.over==='炎上'?'cr':'ca')); S.mlog.push('クレーム：'+sc.def.name+'さん（'+sc.def.cat+'）→ '+sc.over); fpush(sc.def.name+'さん（'+sc.def.cat+'）のクレーム → '+sc.over+'。Googleレビュー ★'+S.after.r1.toFixed(1),'クレーム',sc.over==='炎上'?'warn':'');

  else if(a==='next'){S.phase='run'; resumeClock()}
  else if(a==='monthnext'){
    if(S.m<3){

      S.m++;
      S.recur=Math.round(S.recur*S.ret+S.newp);

  }
  else if(a==='savecard'||a==='sharecard'){
    var msg=$('#sharemsg'), url=S.cardUrl; if(!url) return;
    var say=function(t){var el=$('#sharemsg'); if(el) el.textContent=t};
    var bl; try{bl=dataUrlToBlob(url)}catch(e6){say('画像の用意に失敗しました。画像を長押し（右クリック）して保存してください。'); return}
    var fname='clinic-month'+S.m+'.png';
    var doSave=function(){
      if(!DL){say('この画面では保存機能が使えません。画像を長押し（右クリック）して保存してください。'); return Promise.resolve()}
      return DL.save({filename:fname,data:bl}).then(function(){say('保存しました。')}).catch(function(e){say((e&&e.code==='declined')?'保存をやめました。':'保存できませんでした（'+((e&&e.code)||'error')+'）。画像を長押し（右クリック）して保存してください。')});
    };
    if(a==='savecard'){doSave(); return}
    var f; try{f=new File([bl],fname,{type:'image/png'})}catch(e7){f=null}
    if(f&&navigator.share&&navigator.canShare&&navigator.canShare({files:[f]})){
      navigator.share({files:[f],title:'歯科医院開業シミュレーション',text:'院の記録 '+S.m+'か月目'}).then(function(){say('共有しました。')}).catch(function(e){ if(e&&e.name==='AbortError'){say('共有をやめました。')} else {say('共有に対応していないため、保存に切り替えます。'); doSave()} });
    } else { say('この画面では共有メニューが使えないため、保存に切り替えます。'); doSave() }
    return;
  }
  else if(a==='genscn'){
    if(GENBUSY||!SAMPLE) return;
    var q1=document.querySelector('#gcat'),q2=document.querySelector('#gtype'),q3=document.querySelector('#gurg'),q4=document.querySelector('#gnote');
    GENFORM={cat:(q1&&q1.value)||GENFORM.cat,type:(q2&&q2.value)||GENFORM.type,urg:(q3&&q3.value)||GENFORM.urg,note:((q4&&q4.value)||'').slice(0,60)};
    genScenario(); return;
  }
  else if(a==='gendel'){CUSTOM.splice(Number(b.getAttribute('data-i')),1); GENMSG=''}
  else if(a==='ai360'){
    if(!SAMPLE||S.fbBusy||!S.fb) return;
    var ppl=S.fb.people.map(function(q){return q.n+'（'+q.role+'）：'+FBAX.map(function(x){return x[1]+q.sc[x[0]]}).join('、')+'／辞める気持ち：'+q.stay}).join('\n');
    var pr3='あなたは歯科医院のスタッフ全員です。院長への360度評価として、次の各スタッフが、点数と気持ちに合う本音のコメントを、それぞれ60字以内で書いてください。院長を責めすぎず、具体的な場面を1つ入れてください。\n【院長】'+S.prof.id.name+'（'+S.prof.form.n+'）\n【スタッフ】\n'+ppl+'\n次のJSONだけを返してください。{"comments":{"スタッフ名":"コメント"}}';
    S.fbBusy=true; render();
    SAMPLE.json(pr3,{modelTier:'quick',cache:false}).then(function(r){S.fbBusy=false; if(r&&r.comments){S.fbAi=S.fbAi||{}; Object.keys(r.comments).forEach(function(k){if(typeof r.comments[k]==='string') S.fbAi[k]=r.comments[k].slice(0,90)})} render()}).catch(function(){S.fbBusy=false; render()});
    return;
  }
  else if(a==='aireview'){
    if(!SAMPLE||S.rvBusy) return;
    var t0=S.treats[S.m]||calcTreat(), r0=S.res[S.m-1];
    var pr='あなたは、歯科医院の経営を一緒に振り返るコーチです。次のゲームの1か月分の記録を読んで、院長への振り返りコメントを、やさしく具体的に、3〜4文（150字以内）で書いてください。責めず、良かった点を1つ、次の月に試せることを1つ入れてください。\n'+
      '【記録】\n開院の形：'+S.prof.form.n+'、立地：'+S.prof.loc.n+'\n来院数：'+S.pat+'人、資金：'+S.funds+'万円（今月'+(S.visit.net>0?'+':'')+S.visit.net+'万円）\nGoogleレビュー：★'+S.r0.toFixed(1)+'→★'+avg().toFixed(1)+'\nスタッフ満足度：'+S.staff+'、院長の消耗度：'+S.fat+'\n多かった診療：'+t0.rows.slice(0,3).map(function(x){return x.n+x.c+'件'}).join('、')+'\nできごと：'+(S.mlog.join(' / ')||'なし')+'\n'+(r0?'クレーム：'+r0.type+'の患者さん→'+r0.out+'\n':'')+
      '次のJSONだけを返してください。{"review":"コメント本文"}';
    S.rvBusy=true; render();
    var mm=S.m;
    SAMPLE.json(pr,{modelTier:'quick',cache:false}).then(function(r){S.rvBusy=false; if(r&&typeof r.review==='string'&&r.review.trim()) S.rvText[mm]=r.review.trim().slice(0,260); render()}).catch(function(){S.rvBusy=false; render()});
    return;
  }
  else if(a==='again'){S=fresh();BUSY=false;if(RIV){clearInterval(RIV);RIV=null}}
  else if(a==='copy'){
    var rta=$('#resume'), msg=$('#copymsg');
    var done=function(){msg.textContent='コピーしました。'};
    var fallback=function(){rta.focus();rta.select();msg.textContent='テキストを選択しました。コピーしてください。'};
    try{ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(rta.value).then(done,fallback)} else {fallback()} }catch(e2){fallback()}
    return;
  }
  render();
});
try{var bl0=$('#brandlogo'); if(bl0){var lu=logoUrl(); if(lu) bl0.src=lu; else bl0.style.display='none'}}catch(e9){}
render();

    window.claude.use('downloads').then(function(d){ if(d){DL=d; render()} }).catch(function(){});
    window.claude.use('sample').then(function(s){ if(s){SAMPLE=s; render()} }).catch(function(){});
  }
}catch(e3){}
})();
